spring.application.name=ai-text-to-sql

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ai_text_to_sql}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql
# Do not fail if tables already exist, handled in schema.sql
spring.sql.init.continue-on-error=true

# Actuator Configuration
management.endpoints.web.exposure.include=health

# --- Spring AI / Google Gemini Configuration ---
# Configured for Google Gemini API via its official OpenAI-compatible endpoint.
# Reference: https://ai.google.dev/gemini-api/docs/openai
# Supply your Gemini API key via the GEMINI_API_KEY environment variable.
spring.ai.openai.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
spring.ai.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:placeholder-gemini-key}}
spring.ai.openai.chat.options.model=${GEMINI_MODEL:gemini-3.6-flash}

# Spring AI Retry Configuration (handles transient 503 / 429 errors from Google Gemini)
spring.ai.retry.max-attempts=4
spring.ai.retry.backoff.initial-interval=2000ms
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10000ms
spring.ai.retry.on-http-codes=429,500,503
