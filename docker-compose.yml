version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: ai_text_to_sql_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai_text_to_sql
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build: .
    container_name: ai_text_to_sql_app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/ai_text_to_sql
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - GEMINI_API_KEY=${GEMINI_API_KEY:-AQ.Ab8RN6JstVSdTlxiEk89aGaYqwTRUv6O3_9nXUq3ATpAL5YUKA}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.6-flash}
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres-data:
